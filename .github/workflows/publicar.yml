name: Publicar Posts Multimarca (Mishyo & Johnata)

on:
  schedule:
    # Mishyo manhã: 9h BRT, tentativas 09:17, 09:37 e 09:57 (12:xx UTC)
    - cron: '17,37,57 12 * * *'
    # Johnata: 12h30 BRT, tentativas 12:37, 12:47 e 12:57 (15:xx UTC)
    - cron: '37,47,57 15 * * *'
    # Mishyo tarde: 13h BRT, tentativas 13:17, 13:37 e 13:57 (16:xx UTC)
    - cron: '17,37,57 16 * * *'
    # Mishyo noite: 17h BRT, tentativas 17:17, 17:37 e 17:57 (20:xx UTC)
    - cron: '17,37,57 20 * * *'
    # Métricas: 23h30 BRT, tentativas 23:37, 23:47 e 23:57 (02:xx UTC)
    - cron: '37,47,57 2 * * *'
  workflow_dispatch:
    inputs:
      marca:
        description: 'Marca a publicar (mishyo, johnata ou todas)'
        required: false
        type: choice
        options:
          - todas
          - mishyo
          - johnata
        default: todas
      dry_run:
        description: 'Executar em modo simulação (--dry-run)'
        required: false
        type: boolean
        default: false

concurrency:
  group: maquina-publicador
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Composio CLI
        run: |
          curl -fsSL https://composio.dev/install | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.composio" >> $GITHUB_PATH

      - name: Autenticar Composio
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          # Saída silenciada: o repositório é público e o login e o whoami mostram e-mail e org da conta.
          composio login --user-api-key "$COMPOSIO_API_KEY" -y --no-skill-install > /dev/null
          composio whoami > /dev/null && echo "Composio autenticado"

      - name: Executar testes unitários
        run: |
          python3 -m unittest discover tests/

      - name: Executar Publicador
        run: |
          ARGS="--fonte=drive"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.marca }}" ] && [ "${{ github.event.inputs.marca }}" != "todas" ]; then
            ARGS="$ARGS --marca=${{ github.event.inputs.marca }}"
          fi
          echo "Executando: python3 scripts/maquina_publicador.py $ARGS"
          python3 scripts/maquina_publicador.py $ARGS

      - name: Registrar histórico no repositório
        if: success()
        run: |
          if [ -n "$(git status --porcelain historico/LOG.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add historico/LOG.md
            git commit -m "log(maquina): registrar publicacao no historico [skip ci]"
            git push
          fi
