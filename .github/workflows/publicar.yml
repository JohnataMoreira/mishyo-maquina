name: Publicar Posts Multimarca (Mishyo & Johnata)

on:
  schedule:
    # 09:05 BRT (12:05 UTC) — Mishyo manhã
    - cron: '17,37,57 12 * * *'
    # 12:30 BRT (15:30 UTC) — Johnata post do dia
    - cron: '37,47,57 15 * * *'
    # 13:05 BRT (16:05 UTC) — Mishyo tarde
    - cron: '17,37,57 16 * * *'
    # 17:05 BRT (20:05 UTC) — Mishyo noite (ajustado para 17h a pedido do Johnata)
    - cron: '17,37,57 20 * * *'
    # 23:30 BRT (02:30 UTC) — Métricas diárias
    - cron: '37,47,57 2 * * *'
  workflow_dispatch:
    inputs:
      marca:
        description: 'Marca a publicar (mishyo, johnata ou todas)'
        required: false
        type: choice
        options:
          - todas
          - mishyo
          - johnata
        default: todas
      dry_run:
        description: 'Executar em modo simulação (--dry-run)'
        required: false
        type: boolean
        default: false

concurrency:
  group: maquina-publicador
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Composio CLI
        run: |
          curl -fsSL https://composio.dev/install | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.composio" >> $GITHUB_PATH

      - name: Autenticar Composio
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          composio login --user-api-key "$COMPOSIO_API_KEY" -y --no-skill-install
          composio whoami

      - name: Executar testes unitários
        run: |
          python3 -m unittest discover tests/

      - name: Executar Publicador
        run: |
          ARGS="--fonte=drive"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.marca }}" ] && [ "${{ github.event.inputs.marca }}" != "todas" ]; then
            ARGS="$ARGS --marca=${{ github.event.inputs.marca }}"
          fi
          echo "Executando: python3 scripts/maquina_publicador.py $ARGS"
          python3 scripts/maquina_publicador.py $ARGS

      - name: Registrar histórico no repositório
        if: success()
        run: |
          if [ -n "$(git status --porcelain historico/LOG.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add historico/LOG.md
            git commit -m "log(maquina): registrar publicacao no historico [skip ci]"
            git push
          fi
