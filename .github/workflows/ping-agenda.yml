name: Diagnostico do agendador (temporario)

# Teste de 09/11/2026: nenhum cron do publicar.yml disparou desde a criacao do repositorio.
# Este workflow so imprime a hora; se ele rodar sozinho, o agendador do GitHub funciona neste repo.
# Remover depois do diagnostico.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: date -u
